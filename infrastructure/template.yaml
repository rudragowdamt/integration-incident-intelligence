AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lightweight serverless deployment for Integration Incident Intelligence.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENABLE_BEDROCK: "true"
        BEDROCK_REGION: "ap-south-1"
        BEDROCK_MODEL_ID: "To_Be_Filled_with_Actual_Values"
        SERVICENOW_ENABLED: "true"
        SERVICENOW_MODE: "servicenow"
        SERVICENOW_SECRET_ARN: "To_Be_Filled_with_Actual_Values"

Resources:
  IncidentFunction:
    Type: AWS::Serverless::Function
    Properties:
      # IMPORTANT: package only the lightweight Lambda directory.
      # Do not use ../ here because the repository contains ML training dependencies.
      CodeUri: ../lambda/
      Handler: handler.lambda_handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: "*"
      Events:
        IncidentApi:
          Type: Api
          Properties:
            Path: /incident
            Method: post

Outputs:
  IncidentFunctionName:
    Description: Lambda function name
    Value: !Ref IncidentFunction
  IncidentApi:
    Description: API endpoint
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/incident"
